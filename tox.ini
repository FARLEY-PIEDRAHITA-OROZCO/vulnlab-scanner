# Tox configuration for VulnLab Scanner
# Install: pip install tox
# Run: tox

[tox]
envlist = py38, py39, py310, py311, lint, format
skip_missing_interpreters = true

[testenv]
deps = 
    pytest>=8.0.0
    pytest-cov>=4.0.0
    pytest-mock>=3.12.0
commands = 
    pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

[testenv:lint]
deps = 
    flake8>=6.0.0
    flake8-bugbear
commands = 
    flake8 app/ tests/ --max-line-length=127 --max-complexity=10 --ignore=E203,W503

[testenv:format]
deps = 
    black>=23.0.0
    isort>=5.12.0
commands = 
    black --check --line-length=127 app/ tests/
    isort --check --profile=black --line-length=127 app/ tests/

[testenv:security]
deps = 
    bandit>=1.7.0
commands = 
    bandit -r app/ -x tests/ -ll

[flake8]
max-line-length = 127
max-complexity = 10
ignore = E203, W503, E501
exclude = 
    .venv,
    .git,
    __pycache__,
    dist,
    build,
    *.egg-info

[coverage:run]
source = app
omit = 
    */tests/*
    */.venv/*

[coverage:report]
exclude_lines = 
    pragma: no cover
    def __repr__
    if __name__ == .__main__.
