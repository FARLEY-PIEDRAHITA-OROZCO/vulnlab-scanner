[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnlab-scanner"
version = "1.4.1"
description = "Herramienta profesional de escaneo de vulnerabilidades web basada en OWASP Top 10"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "VulnLab Team", email = "contact@vulnlab.com"},
]
dependencies = [
    "requests>=2.31.0",
    "colorama>=0.4.6",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "tqdm>=4.65.0",
]

[project.scripts]
vulnlab-scan = "app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.12.0",
]

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*", "docs", "docs.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
